<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Network Health AI — Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Smooth transitions on bars */
    .bar-fill { transition: width 0.4s ease; }
    /* Custom scrollbar for tables */
    .overflow-x-auto::-webkit-scrollbar { height: 4px; }
    .overflow-x-auto::-webkit-scrollbar-track { background: #f1f5f9; }
    .overflow-x-auto::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen">

  <!-- ── Top Nav ── -->
  <nav class="bg-slate-900 border-b border-slate-700 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 flex items-center justify-between h-14">

      <!-- Brand -->
      <div class="flex items-center gap-3">
        <!-- Ansible "A" icon -->
        <div class="w-8 h-8 rounded-md bg-red-600 flex items-center justify-center shrink-0">
          <svg viewBox="0 0 24 24" class="w-5 h-5 fill-white" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1.5 14.5l-3-7 7 3-2.5 1L12 16l-1.5.5zm3.5-4.5l-4-1.5 1.5 4 1-2.5 1.5 1-1.5-3 1.5 2z"/>
          </svg>
        </div>
        <div>
          <span class="text-white font-semibold text-sm tracking-wide">Network Health AI</span>
          <span class="hidden sm:inline text-slate-400 text-xs ml-2">/ Ansible Automation Platform + Claude MCP</span>
        </div>
      </div>

      <!-- Nav links -->
      <div class="flex items-center gap-1 text-sm">
        <a href="/" class="px-3 py-1.5 rounded text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">Dashboard</a>
        <a href="/reports" class="px-3 py-1.5 rounded text-slate-300 hover:text-white hover:bg-slate-700 transition-colors">Reports</a>
        <!-- Live indicator -->
        <div class="ml-3 flex items-center gap-1.5 text-xs text-slate-400">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          Live
        </div>
      </div>

    </div>
  </nav>

  <!-- ── Page content ── -->
  <div class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    {% block content %}{% endblock %}
  </div>

  <!-- ── Footer ── -->
  <footer class="mt-12 border-t border-slate-200 bg-white">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex flex-col sm:flex-row items-center justify-between gap-2 text-xs text-slate-400">
      <div class="flex items-center gap-4">
        <span>Network Health AI — Nexus Integration Demo</span>
        <span class="hidden sm:inline">·</span>
        <span class="hidden sm:inline">Claude + AAP MCP + Ansible Galaxy + EDA</span>
      </div>
      <div>{{ now if now is defined else "" }}</div>
    </div>
  </footer>

</body>
</html>
